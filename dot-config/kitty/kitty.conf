# ============================================================
# KITTY — GRUVBOX MATERIAL DARK SOFT
# Minimalista • quente • japonês • rápido
# ============================================================

# ============================================================
# FONTE
# ============================================================

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Auto
italic_font JetBrainsMono Nerd Font Auto
bold_italic_font JetBrainsMono Nerd Font Auto

font_size 12.0

disable_ligatures never

box_drawing_scale 0.001, 1, 1.5, 2


# ============================================================
# CORES — GRUVBOX MATERIAL DARK SOFT
# ============================================================
# background #282828
# foreground #d4be98
# selection_background #504945
# selection_foreground #ebdbb2
# cursor #d8a657
# cursor_text_color #282828
# url_color #7daea3
# active_border_color #d8a657
# inactive_border_color #3c3836


# ============================================================
# GRUVBOX ANSI PALETTE
# ============================================================
# color0  #282828
# color1  #ea6962
# color2  #a9b665
# color3  #d8a657
# color4  #7daea3
# color5  #d3869b
# color6  #89b482
# color7  #d4be98
# color8  #665c54
# color9  #ea6962
# color10 #a9b665
# color11 #d8a657
# color12 #7daea3
# color13 #d3869b
# color14 #89b482
# color15 #ebdbb2


# ============================================================
# HYPRLAND / JANELA
# ============================================================

hide_window_decorations yes

window_padding_width 6
window_margin_width 0
single_window_margin_width 0

placement_strategy center

background_opacity 1.0


# ============================================================
# PERFORMANCE
# ============================================================

repaint_delay 8
input_delay 2

sync_to_monitor yes


# ============================================================
# CURSOR
# ============================================================

cursor_shape beam

cursor_blink_interval 0
cursor_stop_blinking_after 0


# ============================================================
# CLIPBOARD
# ============================================================

copy_on_select clipboard

strip_trailing_spaces smart


# ============================================================
# COPIAR / COLAR
# ============================================================

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map shift+insert paste_from_clipboard

map alt+y copy_to_clipboard
map alt+p paste_from_clipboard

map shift+alt+v paste_from_selection


# ============================================================
# SCROLLBACK
# ============================================================

scrollback_lines 20000

scrollback_pager_history_size 128

wheel_scroll_multiplier 3.0

# Abre o scrollback diretamente no Neovim
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' '$' -

map ctrl+shift+h show_scrollback


# ============================================================
# BELL
# ============================================================

enable_audio_bell no

visual_bell_duration 0.0


# ============================================================
# URLS
# ============================================================

open_url_with default

detect_urls yes

underline_hyperlinks hover


# ============================================================
# TABS
# ============================================================

tab_bar_edge top

tab_bar_style powerline

tab_powerline_style slanted
# active_tab_foreground #282828
# active_tab_background #d8a657
# inactive_tab_foreground #d4be98
# inactive_tab_background #3c3836


# ============================================================
# SHELL / COMPORTAMENTO
# ============================================================

shell /usr/bin/zsh

shell_integration enabled

mouse_hide_wait 2.0

focus_follows_mouse no

confirm_os_window_close 0

remember_window_size yes

initial_window_width 1100
initial_window_height 700

startup_session none


# ============================================================
# HINTS — NAVEGAÇÃO SEM MOUSE
# ============================================================

map ctrl+shift+p>u open_url_with_hints

map ctrl+shift+p>f kitten hints --type path --program @

map ctrl+shift+p>w kitten hints --type word --program @

map ctrl+shift+p>l kitten hints --type line --program @


# BEGIN_KITTY_THEME
# Gruvbox Material Dark Soft
include current-theme.conf
# END_KITTY_THEME