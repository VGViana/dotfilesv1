# =========================================================
# YAZI CONFIG
# =========================================================


# =========================================================
# MANAGER
# =========================================================

[mgr]

show_hidden = true

# parent / current / preview
ratio = [1, 3, 4]

sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

linemode = "none"


# =========================================================
# PREVIEW
# =========================================================

[preview]

max_width = 1200
max_height = 1200

cache_dir = ""

image_delay = 0


# =========================================================
# TASKS
# =========================================================

[tasks]

micro_workers = 5
macro_workers = 5


# =========================================================
# OPENERS
# =========================================================

[opener]

# ---------------------------------------------------------
# NVIM
# ---------------------------------------------------------

edit = [
    { run = 'nvim %s', block = true }
]


# ---------------------------------------------------------
# PDF — SIOYEK
# ---------------------------------------------------------

pdf = [
    { run = 'sioyek %s', orphan = true }
]


# ---------------------------------------------------------
# IMAGES — IMV
# ---------------------------------------------------------

image = [
    { run = 'imv %s', block = true }
]


# ---------------------------------------------------------
# VIDEO — MPV
# ---------------------------------------------------------

video = [
    { run = 'mpv %s', block = true }
]


# ---------------------------------------------------------
# AUDIO — MPV
# ---------------------------------------------------------

audio = [
    { run = 'mpv %s', block = true }
]


# ---------------------------------------------------------
# LIBREOFFICE WRITER
# ---------------------------------------------------------

writer = [
    { run = 'libreoffice --writer %s', orphan = true }
]


# ---------------------------------------------------------
# LIBREOFFICE CALC
# ---------------------------------------------------------

calc = [
    { run = 'libreoffice --calc %s', orphan = true }
]


# =========================================================
# OPEN RULES
# =========================================================

[open]

prepend_rules = [

    # =====================================================
    # TEXTO / CONFIGURAÇÃO / CÓDIGO → NVIM
    # =====================================================

    { url = "*.{txt,md,conf,config,json,jsonc,toml,yaml,yml,ini,lua,sh,bash,zsh,py,css,scss,js,ts,html,rasi}", use = "edit" },

    # Fallback para qualquer arquivo MIME de texto
    { mime = "text/*", use = "edit" },


    # =====================================================
    # PDF → SIOYEK
    # =====================================================

    { mime = "application/pdf", use = "pdf" },


    # =====================================================
    # WORD / WRITER → LIBREOFFICE WRITER
    # =====================================================

    { mime = "application/msword", use = "writer" },

    { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = "writer" },

    { mime = "application/vnd.oasis.opendocument.text", use = "writer" },


    # =====================================================
    # EXCEL / CALC → LIBREOFFICE CALC
    # =====================================================

    { mime = "application/vnd.ms-excel", use = "calc" },

    { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = "calc" },

    { mime = "application/vnd.oasis.opendocument.spreadsheet", use = "calc" },


    # =====================================================
    # IMAGENS → IMV
    # =====================================================

    { mime = "image/*", use = "image" },


    # =====================================================
    # VÍDEO → MPV
    # =====================================================

    { mime = "video/*", use = "video" },


    # =====================================================
    # ÁUDIO → MPV
    # =====================================================

    { mime = "audio/*", use = "audio" }
]
