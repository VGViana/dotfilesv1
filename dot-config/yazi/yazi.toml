"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio = [1, 4, 3]

sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

show_hidden = true
show_symlink = true
scrolloff = 6

mouse_events = ["click", "scroll", "drag"]


[preview]
wrap = "no"
tab_size = 2

max_width = 1000
max_height = 800

image_delay = 0
image_filter = "triangle"
image_quality = 80


[opener]

edit = [
    { run = "nvim %s", block = true, desc = "Neovim" }
]

pdf = [
    { run = "sioyek %s", orphan = true, desc = "Sioyek" }
]

image = [
    { run = "imv %s", orphan = true, desc = "imv" }
]

media = [
    { run = "mpv %s", orphan = true, desc = "mpv" }
]

system = [
    { run = "xdg-open %s1", orphan = true, desc = "Abrir com o sistema" }
]


[open]

prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },

    { mime = "application/pdf", use = "pdf" },

    { mime = "image/*", use = "image" },

    { mime = "video/*", use = "media" },
    { mime = "audio/*", use = "media" }
]
