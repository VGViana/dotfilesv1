# ============================================================
# VINICIUS — NCSPOT
# ============================================================
#
# Filosofia:
#   - keyboard-first
#   - Vim-like
#   - minimalista
#   - Gruvbox Material Dark Soft
#   - integração com Kitty
#
# ============================================================
# GERAL
# ============================================================

# Mantém os atalhos padrão disponíveis.
default_keybindings = true

# Nerd Font para ícones e indicadores.
use_nerdfont = true

# Notificações de desktop.
notify = true

# Reprodução sem gap entre faixas.
gapless = true

# 320 kbps — máxima qualidade disponível no streaming.
bitrate = 320

# Normalização de volume.
volnorm = true

# Shuffle começa desligado.
shuffle = false

# Repetição começa desligada.
repeat = "off"

# Estado inicial da reprodução.
playback_state = "Paused"

# Tela inicial.
initial_screen = "library"

# Biblioteca enxuta.
library_tabs = [
    "tracks",
    "albums",
    "artists",
    "playlists"
]

# Esconde username do Spotify na interface.
hide_display_names = true

# ============================================================
# CACHE DE ÁUDIO
# ============================================================

# Mantém músicas em cache para reduzir downloads repetidos.
audio_cache = true

# Cache de 512 MiB.
#
# É suficientemente grande para seu uso sem transformar
# o cache em armazenamento permanente.
audio_cache_size = 512


# ============================================================
# STATUS
# ============================================================

# Informações úteis sem poluir a interface.
statusbar_format = "%artists - %title"

[track_format]

# Artista + música à esquerda.
left = "%artists - %title"

# Álbum no centro.
center = "%album"

# Estado de salvamento + duração à direita.
right = "%saved %duration"


# ============================================================
# NOTIFICAÇÕES
# ============================================================

[notification_format]

title = "%title"
body = "%artists - %album"


# ============================================================
# TECLADO
# ============================================================

[keybindings]

# ============================================================
# REPRODUÇÃO
# ============================================================

# Play / pause
"p" = "playpause"
"Enter" = "play"

# Stop
"s" = "stop"

# Faixa anterior / próxima
"Shift+h" = "previous"
"Shift+l" = "next"

# ============================================================
# SEEK
# ============================================================

# Pequenos saltos
"b" = "seek -1000"
"f" = "seek +1000"

# Grandes saltos
"Shift+b" = "seek -10000"
"Shift+f" = "seek +10000"


# ============================================================
# REPEAT / SHUFFLE
# ============================================================

"r" = "repeat"
"z" = "shuffle"


# ============================================================
# BIBLIOTECA / FAIXAS
# ============================================================

# Salvar / remover dos favoritos
"Shift+s" = "save"

# Abrir seleção
"o" = "open selected"

# Abrir faixa atual
"Shift+o" = "open current"

# Artista
"a" = "goto artist"

# Álbum
"Shift+a" = "goto album"

# Excluir da fila
"Shift+d" = "delete"


# ============================================================
# FILA
# ============================================================

# Adicionar à fila
"Space" = "queue"

# Salvar fila
"Ctrl+s" = "save queue"

# Mover faixa para baixo
"Shift+j" = "shift down 1"

# Mover faixa para cima
"Shift+k" = "shift up 1"

# Limpar fila
"Shift+c" = "clear"

# Inserir link Spotify da clipboard
"Ctrl+v" = "insert"


# ============================================================
# VOLUME
# ============================================================

# Ajuste fino
"=" = "volup 1"
"-" = "voldown 1"

# Ajuste rápido
"[" = "volup 5"
"]" = "voldown 5"


# ============================================================
# TELAS
# ============================================================

# F1–F3
"F1" = "focus queue"
"F2" = "focus library"
"F3" = "focus search"

# Números
"1" = "focus queue"
"2" = "focus library"
"3" = "focus search"

# Atalho alternativo
"Ctrl+q" = "focus queue"


# ============================================================
# NAVEGAÇÃO — VIM
# ============================================================

"j" = "move down 1"
"k" = "move up 1"
"h" = "move left 1"
"l" = "move right 1"

# Setas continuam funcionando.
"Up" = "move up 1"
"Down" = "move down 1"
"Left" = "move left 1"
"Right" = "move right 1"

# Scroll rápido
"Ctrl+d" = "move down 5"
"Ctrl+u" = "move up 5"

# Top / bottom
"g" = "move top"
"Shift+g" = "move bottom"

# Ir para música atualmente tocando
"." = "move playing"

# Navegação vertical alternativa
"Ctrl+e" = "move down 1"
"Ctrl+y" = "move up 1"

# Voltar
"q" = "back"


# ============================================================
# ORDENAÇÃO
# ============================================================

# Mais recentes primeiro
"t" = "sort added d"

# Ordem alfabética
"Shift+t" = "sort title a"


# ============================================================
# COMPARTILHAMENTO
# ============================================================

# Compartilhar música atual
"y" = "share current"

# Compartilhar música selecionada
"Shift+y" = "share selected"


# ============================================================
# OUTROS
# ============================================================

# Ajuda
"?" = "help"

# Atualizar biblioteca
"Shift+u" = "update"

# Sair
"Shift+q" = "quit"
"Shift+z" = "quit"


# ============================================================
# TEMA — GRUVBOX MATERIAL DARK SOFT
# ============================================================

[theme]

# ------------------------------------------------------------
# Fundo
# ------------------------------------------------------------

background = "#282828"

# ------------------------------------------------------------
# Texto
# ------------------------------------------------------------

primary = "#ebdbb2"
secondary = "#d5c4a1"

# ------------------------------------------------------------
# Títulos
# ------------------------------------------------------------

title = "#d79921"

# ------------------------------------------------------------
# Reprodução
# ------------------------------------------------------------

playing = "#b8bb26"
playing_selected = "#b8bb26"

playing_bg = "#32302f"

# ------------------------------------------------------------
# Seleção
# ------------------------------------------------------------

highlight = "#d79921"
highlight_bg = "#3c3836"

# ------------------------------------------------------------
# Erros
# ------------------------------------------------------------

error = "#fbf1c7"
error_bg = "#cc241d"

# ------------------------------------------------------------
# Statusbar
# ------------------------------------------------------------

statusbar = "#282828"
statusbar_progress = "#b8bb26"
statusbar_bg = "#3c3836"

# ------------------------------------------------------------
# Command line
# ------------------------------------------------------------

cmdline = "#282828"
cmdline_bg = "#d79921"

# ------------------------------------------------------------
# Busca
# ------------------------------------------------------------

search_match = "#fabd2f"
